# Experiment persistence only. No app container.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: emlab-postgres
    environment:
      POSTGRES_USER: emlab
      POSTGRES_PASSWORD: emlab
      POSTGRES_DB: emlab
    ports:
      - "5432:5432"
    volumes:
      - emlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emlab -d emlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  emlab_pgdata:
